<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#eef4fe" />
    <title>lycwl · lycwl</title>
    <script>
      let theme = null;
      const match = document.cookie.match(/(?:^|;\s*)lycwl_theme=(blue|warm)(?:;|$)/);
      if (match) theme = match[1];
      else {
        try {
          theme = window.localStorage.getItem("lycwl:theme");
        } catch {
          // Storage can be unavailable; the blue-white default still applies.
        }
      }
      if (theme === "warm" || theme === "blue") {
        document.documentElement.dataset.theme = theme;
      }
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="会话侧边栏">
        <div class="sidebar-brand">
          <span class="brand-avatar-wrap">
            <span class="brand-avatar" aria-hidden="true">M</span>
            <span class="presence-dot brand-dot" title="在线"></span>
          </span>
          <div class="brand-meta">
            <div class="brand-name">lycwl</div>
            <div class="brand-mode" id="brand-mode">正在连接…</div>
          </div>
          <button
            type="button"
            class="icon-btn sidebar-collapse"
            id="sidebar-collapse"
            aria-label="收起侧边栏"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M14.5 6.5 9 12l5.5 5.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <button type="button" class="new-session-btn" id="new-session-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 5v14M5 12h14"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <span>新会话</span>
        </button>

        <div class="session-list" id="session-list" role="list" aria-label="会话记录">
          <p class="session-empty">正在加载会话…</p>
        </div>

        <div class="sidebar-footer">
          <button type="button" class="footer-btn" id="open-console">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect
                x="3"
                y="4.5"
                width="18"
                height="15"
                rx="3"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
              />
              <path
                d="m7.5 10 2.6 2.4-2.6 2.4M12.5 15h4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>控制台</span>
          </button>
          <button type="button" class="footer-btn" id="open-settings">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle
                cx="12"
                cy="12"
                r="3.2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
              />
              <path
                d="M19 12a7 7 0 0 0-.1-1.1l2-1.5-2-3.4-2.3 1a7.3 7.3 0 0 0-1.9-1.1L14.4 3h-4.8l-.3 2.9a7.3 7.3 0 0 0-1.9 1.1l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .7.1 1.1l-2 1.5 2 3.4 2.3-1a7.3 7.3 0 0 0 1.9 1.1l.3 2.9h4.8l.3-2.9a7.3 7.3 0 0 0 1.9-1.1l2.3 1 2-3.4-2-1.5c.1-.4.1-.7.1-1.1Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linejoin="round"
              />
            </svg>
            <span>设置</span>
          </button>
        </div>
      </aside>

      <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

      <main class="main" id="main">
        <header class="chat-header">
          <button
            type="button"
            class="icon-btn sidebar-toggle"
            id="sidebar-toggle"
            aria-label="展开侧边栏"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M4 7h16M4 12h16M4 17h16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <div class="chat-identity">
            <span class="chat-name">lycwl</span>
            <span class="presence-dot" title="在线"></span>
            <span class="demo-badge" id="header-demo" hidden>未配置</span>
          </div>
          <div class="header-actions">
            <button
              type="button"
              class="icon-btn warnings-btn"
              id="warnings-btn"
              aria-label="查看注意事项"
              title="查看注意事项"
              hidden
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  d="M12 4.5 21 19H3l9-14.5Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
                <path
                  d="M12 10v4M12 16.6v.1"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <span class="chat-status" id="chat-status" role="status" aria-live="polite"></span>
          </div>
        </header>

        <div class="connection-banner" id="connection-banner" role="status" hidden>
          <span class="status-dot status-dot-warn"></span>
          连接断开，正在重连…
        </div>
        <div class="switching-banner" id="switching-banner" role="status" hidden>
          <span class="spinner" aria-hidden="true"></span>
          正在切换会话…
        </div>

        <section class="chat-scroll" id="chat-scroll" aria-label="对话内容">
          <div class="chat-inner">
            <section class="empty-state" id="empty-state">
              <div class="hero-avatar" aria-hidden="true">M</div>
              <div class="hero-identity">
                <span>lycwl</span>
                <span class="presence-dot" title="在线"></span>
              </div>
              <h1>今天想聊什么？</h1>
              <p class="hero-subtitle">从一个问题、计划或此刻的想法开始。</p>
              <div class="suggestions" id="suggestions">
                <button type="button" class="suggestion-card" data-prompt="查询今天的天气">
                  <span class="suggestion-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                      <circle
                        cx="9"
                        cy="9"
                        r="3.4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                      />
                      <path
                        d="M9 2.8v1.6M9 13.6v1.6M2.8 9h1.6M13.6 9h1.6M4.6 4.6l1.1 1.1M12.3 12.3l1.1 1.1M4.6 13.4l1.1-1.1M12.3 5.7l1.1-1.1"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.4"
                        stroke-linecap="round"
                      />
                      <path
                        d="M17.4 20.2H9.6a3.4 3.4 0 0 1-.4-6.8 4.4 4.4 0 0 1 8.3.9 2.95 2.95 0 0 1-.1 5.9Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </span>
                  <span class="suggestion-text">查询今天的天气</span>
                  <span class="suggestion-sub">先看看窗外，再问问我</span>
                </button>
                <button type="button" class="suggestion-card" data-prompt="分析一个问题">
                  <span class="suggestion-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                      <path
                        d="M4 19.5V13m5 6.5V9m5 10.5V5.5m5 14V11"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                      />
                    </svg>
                  </span>
                  <span class="suggestion-text">分析一个问题</span>
                  <span class="suggestion-sub">把复杂的事情拆开来看看</span>
                </button>
                <button type="button" class="suggestion-card" data-prompt="发个表情包打个招呼吧">
                  <span class="suggestion-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                      <circle
                        cx="12"
                        cy="12"
                        r="8.2"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                      />
                      <path
                        d="M8.6 14.2a4.2 4.2 0 0 0 6.8 0"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                      />
                      <path
                        d="M9 9.4v.2M15 9.4v.2"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.2"
                        stroke-linecap="round"
                      />
                    </svg>
                  </span>
                  <span class="suggestion-text">发个表情包打个招呼吧</span>
                  <span class="suggestion-sub">轻松一点，从打招呼开始</span>
                </button>
                <button type="button" class="suggestion-card" data-prompt="搜索一张图片">
                  <span class="suggestion-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                      <rect
                        x="3.5"
                        y="4.5"
                        width="17"
                        height="15"
                        rx="2.6"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                      />
                      <circle
                        cx="9"
                        cy="9.6"
                        r="1.7"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      />
                      <path
                        d="m5.5 17 4.4-4.3 3 2.9 2.6-2.3 3 3.7"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </span>
                  <span class="suggestion-text">搜索一张图片</span>
                  <span class="suggestion-sub">描述画面，我来帮你找</span>
                </button>
              </div>
            </section>

            <div class="transcript" id="transcript" aria-live="polite"></div>
          </div>
        </section>

        <div class="composer-area">
          <div class="composer-inner">
            <div class="todo-panel" id="todo-panel" hidden></div>
            <div class="waiting-slot" id="waiting-slot" hidden></div>
            <div class="banner-slot" id="banner-slot" hidden></div>

            <form class="composer" id="composer" autocomplete="off">
              <div class="attach-chips" id="attach-chips" hidden></div>
              <label class="sr-only" for="composer-input">消息内容</label>
              <textarea
                id="composer-input"
                class="composer-input"
                rows="1"
                placeholder="给 lycwl 发消息"
                aria-label="给 lycwl 发消息"
              ></textarea>
              <div class="composer-toolbar">
                <div class="composer-tools">
                  <button type="button" class="icon-btn" id="attach-btn" aria-label="添加图片">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path
                        d="m12.2 7.3 5.1 5.1a4 4 0 0 1-5.7 5.7l-6.1-6.1a2.9 2.9 0 1 1 4.1-4.1l6 6a1.8 1.8 0 0 1-2.6 2.6l-4.8-4.8"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </button>
                  <span class="model-pill" id="model-pill">…</span>
                </div>
                <div class="composer-meta">
                  <span class="context-meter" id="context-meter">上下文 --</span>
                  <button
                    type="button"
                    class="icon-btn stop-btn"
                    id="stop-btn"
                    aria-label="停止当前任务"
                    title="停止当前任务"
                    hidden
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" />
                    </svg>
                  </button>
                  <button type="submit" class="send-btn" id="send-btn" aria-label="发送消息">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path
                        d="M12 19V5m0 0-6 6m6-6 6 6"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </button>
                </div>
              </div>
            </form>
            <input
              type="file"
              id="image-input"
              accept="image/png,image/jpeg,image/webp,image/gif"
              multiple
              hidden
            />
            <p class="composer-hint" id="composer-hint">Enter 发送 · Shift+Enter 换行</p>
            <div class="shutdown-notice" id="shutdown-notice" hidden>
              服务已关闭，可以关闭此标签页了。
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <div
        class="modal"
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        tabindex="-1"
      >
        <header class="modal-header">
          <h2 class="modal-title" id="modal-title"></h2>
          <button type="button" class="icon-btn" id="modal-close" aria-label="关闭对话框">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="m6 6 12 12M18 6 6 18"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </header>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
