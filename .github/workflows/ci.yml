name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # The project targets Windows 11; the Windows-specific adapters and their
    # tests cannot run meaningfully on Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.10.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The test tree is currently untracked by project decision. A checkout
      # therefore contains no tests, and `node --test` with no files exits 0 while
      # running nothing. Failing loudly here prevents a green CI that proves nothing.
      - name: Require tests to be present
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Path tests -Recurse -Filter *.test.ts -ErrorAction SilentlyContinue
          if (-not $tests) {
            Write-Error "No test files found under tests/. The test tree is not tracked in this repository, so CI cannot verify anything."
            exit 1
          }

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Architecture boundaries
        run: pnpm run test:architecture

      - name: Unit and integration tests
        run: pnpm run test

      - name: TUI render tests
        run: pnpm run test:tui
